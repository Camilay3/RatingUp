<section>
	<div class="hole-left"></div>
	<div class="hole-right"></div>

	<div class="foto"></div>

	<div class="infos">

		<div class="header">
			<h1>{{ user?.nickname }} <i class="fa-solid fa-pencil"></i></h1>
			<p>Nível {{ capAtual }}</p>
		</div>

		<div class="section">
			<p><span>Enxadrista:</span>{{ user?.name }} <i class="fa-solid fa-pencil"></i></p>
			<p><span>Email:</span>{{ user?.email }} <i class="fa-solid fa-pencil"></i></p>
			<p><span>Telefone:</span>{{ formatPhone(user?.telefone) }} <i class="fa-solid fa-pencil"></i></p>
			<p><span>Início do aprendizado:</span>xx/xx/xxxx</p>
		</div>

		<button class="outline small">Alterar senha</button>
		<button class="small">Voltar para o início</button>
	</div>
</section>
