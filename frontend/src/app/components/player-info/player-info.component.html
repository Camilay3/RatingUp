<div class="jogador" [class.ativo]="active()">
	<span class="peca" [class.branca]="color() === 'white'"
		  [attr.aria-label]="color() === 'white' ? 'Brancas' : 'Pretas'"></span>
	<strong class="nome">{{ name() }}</strong>
	<span class="rating" title="Rating na categoria da partida">{{ rating() ?? '—' }}</span>
	@if (change() !== null && change() !== undefined) {
	<span class="delta" [class.positivo]="change()! > 0" [class.negativo]="change()! < 0">
			{{ change()! > 0 ? '+' : '' }}{{ change() }}
		</span>
	}
	@if (timeMs() !== null) {
	<span class="relogio" role="timer"
		  [class.ativo]="active()" [class.baixo]="lowTime()"
		  [attr.aria-label]="'Tempo restante ' + clockText()">{{ clockText() }}</span>
	}
</div>
