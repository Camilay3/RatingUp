@if (loading) {
  <div>Carregando pergunta...</div>
}

@if (!loading && pergunta) {
  <div class="quiz-card">
    <div class="quiz-header">
      <h2>Responda para concluir a fase !!!</h2>
      <p>{{ pergunta.questionText }}</p>
    </div>

    <div class="quiz-corpo">
      <div class="opcoes">
        @for (opcao of pergunta.options; track opcao.id) {
          <label
            [class.selecionada]="opcaoSelecionada === opcao.id && opcaoConfirmada === null"
            [class.correta]="quizConcluido && opcaoConfirmada === opcao.id"
            [class.incorreta]="errou && opcaoConfirmada === opcao.id"
            [class.disabled]="quizConcluido || enviando"
          >
            <input
              type="radio"
              [name]="'pergunta-' + pergunta.subtopicId"
              [value]="opcao.id"
              [checked]="opcaoSelecionada === opcao.id"
              [disabled]="quizConcluido || enviando"
              (change)="selecionarOpcao(opcao.id)"
            />
            {{ opcao.optionText }}
          </label>
        }
      </div>

      @if (errou) {
        <p class="erro">❌ Resposta errada! Tente novamente.</p>
      }

      <button
        class="confirmar"
        (click)="confirmarResposta()"
        [disabled]="opcaoSelecionada === null || quizConcluido || enviando"
      >
        Confirmar
      </button>
    </div>
  </div>
}
