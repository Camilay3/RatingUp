<p>login works!</p>
<div class="login.container" >

    <div class="background">
        <!--<app-book></app-book>-->
        <img src="livro/background.png" alt="" class="livro-fundo">
        <img src="livro/capa.png" alt="" class="livro-capa">
    </div>

    <div class="overdelay" ></div>

    <div class="content" >

      <div class="left-col" > 

       <h1 class="title">
         RatingUp
       </h1>

       <h3 class="subtitle">
            @if (isFirstAcess) {
                Crie sua conta para começar sua jornada de aprendizado
            } @else {
                Entre para continuar sua jornada no aprendizado
            }
        </h3>

       <!-- <div class="tab-buttons">
        <button (click)="choseForm(false)" *ngIf="isFirstAcess === true" >Entrar</button>
        <button (click)="choseForm(true)" *ngIf="isFirstAcess === false" >Cadastro</button>
       </div>  
      </div>   -->

        <div *ngIf="isFirstAcess === true"> <!--Parte de Cadastro-->

            <form [formGroup]="RegisterForm" (ngSubmit)="onRegister()">

            <mat-form-field appearance="outline" floatLabel="auto">
      <mat-label>Nome completo</mat-label>
      <input matInput type="text" placeholder="João Silva" formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="outline" floatLabel="auto">
      <mat-label>Apelido</mat-label>
      <input matInput type="text" placeholder="joao123" formControlName="nickname">
    </mat-form-field>

    <mat-form-field appearance="outline" floatLabel="auto">
      <mat-label>Telefone</mat-label>
      <input matInput type="text" placeholder="(85) 99999-9999" formControlName="telefone">
    </mat-form-field>

    <mat-form-field appearance="outline" floatLabel="auto">
      <mat-label>E-mail</mat-label>
      <input matInput type="email" placeholder="seu@email.com" formControlName="email">
    </mat-form-field>

    <mat-form-field appearance="outline" floatLabel="auto">
      <mat-label>Senha</mat-label>
      <input matInput type="password" placeholder="Mínimo 8 caracteres" formControlName="password">
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit">Cadastrar</button>
            <p class="registre" (click)="choseForm(false)" >Tem conta ? Entrar</p>

            </form>
        </div>

        <div *ngIf="isFirstAcess === false" > <!--Parte do Login -->

        <form [formGroup]="LoginForm" (ngSubmit)="onLogin()">
  
            <!-- login.component.html -->
        <mat-form-field appearance="outline" floatLabel="auto">
          <mat-label>E-mail</mat-label>
          <input matInput type="email" placeholder="seu@email.com" formControlName="email">
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="auto" >
            <mat-label>Senha</mat-label>
            <input matInput type="password" placeholder="Digite sua senha" formControlName="password">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit">Entrar</button>
        <p class="registre" (click)="choseForm(true)" >Não tem uma conta? Cadastre-se</p>
            <!-- <button (click)="choseForm(true)" >Cadastro</button> -->
        </form>
        </div>
        

    </div>

</div>
