@if(step === 'email'){
 <div class="Content">

    <h1>E-mail para recuperação da senha</h1>

  <form [formGroup]="EmailForm" (ngSubmit)="emailSubmit()" >
    <mat-form-field appearance="outline" floatlabel="auto" >
        <mat-label>E-mail</mat-label>
        <input matInput type="email" placeholder="seu@email.com" formControlName="email">
    </mat-form-field>

    <button type="submit" class="enviar" [disabled]="EmailForm.invalid" > Enviar E-mail </button>

  </form>

 </div>
}

@if(step === 'code'){
 <div class="Content" >

    <h1>Digite o codigo enviado no seu e-mail</h1>

    <form [formGroup]="CodeForm" (ngSubmit)="codeSubmit()" >
        <mat-form-field appearance="outline" floatlabel="auto" >
            <mat-label>Codigo de Verificação</mat-label>
            <input matInput type="number" placeholder="123456" formControlName="code" >
        </mat-form-field>

        <button type="submit" [disabled]="CodeForm.invalid" > Verificar Codigo </button>

    </form>

 </div>
}

@if(step === 'password'){
 <div class="Content" >

    <form [formGroup]="NewPasswordForm" (ngSubmit)="NewPasswordSubmit()" >

        <mat-form-field appearance="outline" floatlabel="auto" >
            <mat-label>Nova senha</mat-label>
            <input matInput type="password" placeholder="SuaNovaSenha@123" formControlName="NewPassword" >
        </mat-form-field>

        <button type="submit" [disabled]="NewPasswordForm.invalid" >Redefinir Senha</button>

    </form>

 </div>
}
