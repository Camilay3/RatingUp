services:
  postgres_db:
    image: postgres:18-alpine
    container_name: ratingup_db
    environment:
      - POSTGRES_DB=ratingup
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin123
    ports:
      - "5432:5432"
  backend:
    image: eclipse-temurin:25-jdk
    container_name: ratingup_back
    depends_on:
      - postgres_db
    ports:
      - "8080:8080"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/ratingup
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    command: ./mvnw spring-boot:run