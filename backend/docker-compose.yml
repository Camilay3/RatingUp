services:
  postgres_db:
    image: postgres:18-alpine
    container_name: ratingup_db
    environment:
      - POSTGRES_DB=ratingup
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ratingup"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: .
    container_name: ratingup_back
    depends_on:
      postgres_db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/ratingup
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123