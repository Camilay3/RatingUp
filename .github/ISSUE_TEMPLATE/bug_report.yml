name: "🐛 Bug"
description: Relatar um bug ou erro encontrado no sistema
title: ""
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição do bug
      description: Uma descrição clara e concisa sobre qual é o bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Passos para reproduzir o comportamento.
      placeholder: |
        1. Acesse '...'
        2. Clique em '....'
        3. Role até '....'
        4. Veja o erro
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      description: Uma descrição clara e concisa do que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento atual
      description: O que está acontecendo de fato.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/logs
      description: Se aplicável, adicione screenshots ou logs para ajudar a explicar seu problema.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Condições que devem ser atendidas para considerar o bug corrigido.
      placeholder: |
        [] criterio um
        [] criterio dois
        [] ...
    validations:
      required: true
