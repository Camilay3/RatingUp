services:
  postgres_db:
    image: postgres:18-alpine
    container_name: ratingup_db
    env_file:
      - .env
    expose:
      - "5432"
    networks:
      - back-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ratingup_back
    env_file:
      - .env
    depends_on:
      - postgres_db
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - "8080"
    networks:
      - back-network
      - front-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ratingup_front
    expose:
      - "4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - front-network
  minio:
    image: minio/minio
    container_name: ratingup_minio
    env_file:
      - .env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - back-network
  minio-init:
    image: alpine:latest
    container_name: ratingup_images
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./scripts/minio-init.sh:/scripts/minio-init.sh
      - ./assets/images:/images
    entrypoint: /bin/sh /scripts/minio-init.sh
    networks:
      - back-network
    restart: "no"
  nginx:
    image: nginx:alpine
    container_name: ratingup_proxy
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
      - ./config/nginx/http.d:/etc/nginx/http.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - back-network
      - front-network
networks:
  back-network:
    driver: bridge
  front-network:
    driver: bridge
volumes:
  minio_data: