services:
  postgres_db:
    image: postgres:18-alpine
    container_name: ratingup_db
    environment:
      - POSTGRES_DB=ratingup
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin123
    ports:
      - "5432:5432"
    networks:
      - back-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ratingup_back
    depends_on:
      - postgres_db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/ratingup
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    networks:
      - back-network
      - front-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ratingup_front
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - front-network

networks:
  back-network:
    driver: bridge
  front-network:
    driver: bridge